<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filmovi</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>

<body>

<header>
  <h1>Filmovi</h1>
  <button id="toggle-kosarica" class="cart-btn">🛒 Košarica (0)</button>
</header>

<main>

<aside id="kosarica">
  <h2 id="naslov-kosarice">Košarica (0)</h2>
  <ul id="lista-kosarice"></ul>
  <button id="potvrdi" style="display:none;">Potvrdi</button>
</aside>

<section>

<h2>Popis filmova</h2>

<div id="filteri">
  <input type="text" id="filter-genre" placeholder="Žanr">
  <input type="number" id="filter-year" placeholder="Godina od">
  <input type="text" id="filter-country" placeholder="Država">

  <input type="range" id="filter-rating" min="0" max="10" step="0.1" value="5">
  <span id="rating-value">5</span>

  <button id="filtriraj">Filtriraj</button>
</div>

<table id="filmovi-tablica">
  <thead>
    <tr>
      <th>Naslov</th>
      <th>Godina</th>
      <th>Žanr</th>
      <th>Trajanje</th>
      <th>Država</th>
      <th>Ocjena</th>
      <th>Akcija</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

</section>

</main>

<script src="script.js"></script>

</body>
</html>
